<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>full stack mincraft game - OmniDev Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #030712;
    color: #f8fafc;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-container {
    position: relative;
    width: 800px;
    height: 600px;
    box-shadow: 0 0 50px rgba(56, 189, 248, 0.2), 0 0 100px rgba(139, 92, 246, 0.15);
    border: 2px solid rgba(56, 189, 248, 0.5);
    border-radius: 12px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #0b0f19 0%, #020617 100%);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
  }
  /* HUD Overlay */
  .hud {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    z-index: 10;
  }
  .hud-box {
    background: rgba(15, 23, 42, 0.75);
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    backdrop-filter: blur(8px);
    display: flex;
    gap: 16px;
  }
  .hud-val { color: #38bdf8; font-weight: 700; }
  .shield-bar-bg {
    width: 120px;
    height: 10px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    overflow: hidden;
    margin-top: 4px;
  }
  .shield-bar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ef4444, #38bdf8, #10b981);
    transition: width 0.2s ease;
  }
  /* Modals / Screens */
  .screen {
    position: absolute;
    inset: 0;
    background: rgba(3, 7, 18, 0.88);
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    z-index: 20;
    transition: opacity 0.3s ease;
  }
  .screen.hidden { display: none; }
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 38px;
    font-weight: 900;
    background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  p.subtitle {
    font-size: 18px;
    color: #94a3b8;
    margin-bottom: 24px;
    max-width: 500px;
  }
  .btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #030712;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    border: none;
    border-radius: 8px;
    padding: 14px 36px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
    transition: all 0.2s ease;
    letter-spacing: 1px;
  }
  .btn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 0 35px rgba(56, 189, 248, 0.8);
  }
  .controls-guide {
    margin-top: 24px;
    display: flex;
    gap: 20px;
    font-size: 13px;
    color: #64748b;
  }
  .key {
    background: #1e293b;
    color: #38bdf8;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid #334155;
    font-family: 'Orbitron', monospace;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas" width="800" height="600"></canvas>
  
  <div class="hud" id="hud">
    <div class="hud-box">
      <div>SCORE: <span class="hud-val" id="score-el">0</span></div>
      <div>WAVE: <span class="hud-val" id="wave-el">1</span></div>
      <div>HIGH: <span class="hud-val" id="high-el">0</span></div>
    </div>
    <div class="hud-box" style="flex-direction: column; align-items: flex-end;">
      <div>SHIELD INTEGRITY: <span class="hud-val" id="shield-txt">100%</span></div>
      <div class="shield-bar-bg">
        <div class="shield-bar-fill" id="shield-bar"></div>
      </div>
    </div>
  </div>

  <!-- Start Screen -->
  <div class="screen" id="start-screen">
    <h1>full stack mincraft game</h1>
    <p class="subtitle">Defend the sector! Destroy hostile meteors & alien drones. Collect energy cores to upgrade blasters.</p>
    <button class="btn" id="start-btn">LAUNCH MISSION</button>
    <div class="controls-guide">
      <div><span class="key">WASD / ARROWS</span> Move</div>
      <div><span class="key">SPACE / CLICK</span> Fire Blasters</div>
      <div><span class="key">P</span> Pause</div>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div class="screen hidden" id="gameover-screen">
    <h1 style="background: linear-gradient(135deg, #ef4444, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SECTOR BREACHED</h1>
    <p class="subtitle" id="gameover-stats">Final Score: 0 | Wave: 1</p>
    <button class="btn" id="restart-btn">REDEPLOY FIGHTER</button>
  </div>
</div>

<script>
// Web Audio API Synthesizer (Zero External Dependencies)
const Sound = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  return {
    laser() {
      const c = getCtx();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, c.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, c.currentTime + 0.15);
      gain.gain.setValueAtTime(0.15, c.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, c.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + 0.15);
    },
    explode() {
      const c = getCtx();
      const bufferSize = c.sampleRate * 0.3;
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
      const whiteNoise = c.createBufferSource();
      whiteNoise.buffer = buffer;
      const filter = c.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(400, c.currentTime);
      filter.frequency.linearRampToValueAtTime(50, c.currentTime + 0.3);
      const gain = c.createGain();
      gain.gain.setValueAtTime(0.3, c.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, c.currentTime + 0.3);
      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(c.destination);
      whiteNoise.start();
    },
    powerup() {
      const c = getCtx();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, c.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, c.currentTime + 0.25);
      gain.gain.setValueAtTime(0.2, c.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, c.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + 0.25);
    }
  };
})();

// Game Engine
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let gameState = 'START';
let score = 0, wave = 1, highscore = parseInt(localStorage.getItem('omni_game_hs') || '0');
document.getElementById('high-el').innerText = highscore;

let player = {
  x: 400, y: 500, vx: 0, vy: 0, speed: 6,
  radius: 18, shield: 100, maxShield: 100,
  powerLevel: 1, lastShot: 0
};

let keys = {};
let bullets = [], enemies = [], particles = [], powerups = [], stars = [];

// Init Starfield
for (let i = 0; i < 80; i++) {
  stars.push({
    x: Math.random() * 800,
    y: Math.random() * 600,
    size: Math.random() * 2 + 0.5,
    speed: Math.random() * 1.5 + 0.5,
    alpha: Math.random() * 0.8 + 0.2
  });
}

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'p' || e.key === 'P') togglePause();
});
window.addEventListener('keyup', e => keys[e.key] = false);

// Touch & Mouse Support
let isMouseDown = false;
canvas.addEventListener('mousedown', e => { isMouseDown = true; shoot(); });
canvas.addEventListener('mouseup', () => { isMouseDown = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const targetX = (e.clientX - rect.left) * (canvas.width / rect.width);
  if (gameState === 'PLAYING') player.x += (targetX - player.x) * 0.15;
});

function togglePause() {
  if (gameState === 'PLAYING') gameState = 'PAUSED';
  else if (gameState === 'PAUSED') { gameState = 'PLAYING'; requestAnimationFrame(gameLoop); }
}

function shoot() {
  if (gameState !== 'PLAYING') return;
  const now = Date.now();
  if (now - player.lastShot < 150) return;
  player.lastShot = now;
  Sound.laser();

  if (player.powerLevel === 1) {
    bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -12, color: '#38bdf8' });
  } else if (player.powerLevel === 2) {
    bullets.push({ x: player.x - 12, y: player.y - 15, vx: 0, vy: -12, color: '#38bdf8' });
    bullets.push({ x: player.x + 12, y: player.y - 15, vx: 0, vy: -12, color: '#38bdf8' });
  } else {
    bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -12, color: '#c084fc' });
    bullets.push({ x: player.x - 14, y: player.y - 12, vx: -2.5, vy: -11, color: '#38bdf8' });
    bullets.push({ x: player.x + 14, y: player.y - 12, vx: 2.5, vy: -11, color: '#38bdf8' });
  }
}

function spawnEnemy() {
  const type = Math.random() > 0.3 ? 'meteor' : 'drone';
  enemies.push({
    x: Math.random() * 740 + 30,
    y: -40,
    radius: type === 'meteor' ? Math.random() * 15 + 18 : 16,
    hp: type === 'meteor' ? 2 : 3,
    type: type,
    vx: (Math.random() - 0.5) * 1.5,
    vy: Math.random() * 2 + 1.5 + wave * 0.3,
    rot: 0,
    rotSpeed: (Math.random() - 0.5) * 0.05
  });
}

function spawnExplosion(x, y, color, count = 18) {
  Sound.explode();
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      decay: Math.random() * 0.03 + 0.02,
      color: color || '#f97316',
      size: Math.random() * 3 + 1.5
    });
  }
}

let lastSpawn = 0;
function gameLoop() {
  if (gameState !== 'PLAYING') return;

  // Background Starfield
  ctx.fillStyle = '#020617';
  ctx.fillRect(0, 0, 800, 600);

  ctx.fillStyle = '#ffffff';
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > 600) s.y = 0;
    ctx.globalAlpha = s.alpha;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });
  ctx.globalAlpha = 1.0;

  // Player Movement
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
  if (keys[' '] || isMouseDown) shoot();

  player.x = Math.max(25, Math.min(775, player.x));
  player.y = Math.max(40, Math.min(570, player.y));

  // Thruster particles
  if (Math.random() > 0.3) {
    particles.push({
      x: player.x + (Math.random() - 0.5) * 8,
      y: player.y + 20,
      vx: (Math.random() - 0.5) * 1,
      vy: Math.random() * 3 + 2,
      life: 0.6,
      decay: 0.05,
      color: '#38bdf8',
      size: 3
    });
  }

  // Draw Player Ship
  ctx.save();
  ctx.translate(player.x, player.y);
  // Ship Body
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(-16, 18);
  ctx.lineTo(0, 10);
  ctx.lineTo(16, 18);
  ctx.closePath();
  ctx.fill();
  // Cockpit
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(0, -2, 5, 0, Math.PI * 2);
  ctx.fill();
  // Shield Glow
  if (player.shield > 0) {
    ctx.strokeStyle = 'rgba(56, 189, 248, ' + (player.shield / 150) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  // Update & Draw Bullets
  bullets.forEach((b, bi) => {
    b.x += b.vx;
    b.y += b.vy;
    ctx.fillStyle = b.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = b.color;
    ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
    ctx.shadowBlur = 0;
    if (b.y < -20) bullets.splice(bi, 1);
  });

  // Spawn Enemies
  if (Date.now() - lastSpawn > Math.max(400, 1600 - wave * 150)) {
    spawnEnemy();
    lastSpawn = Date.now();
  }

  // Update & Draw Enemies
  enemies.forEach((e, ei) => {
    e.x += e.vx;
    e.y += e.vy;
    e.rot += e.rotSpeed;

    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.rot);

    if (e.type === 'meteor') {
      ctx.fillStyle = '#94a3b8';
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(0, 14);
      ctx.lineTo(-14, -10);
      ctx.lineTo(14, -10);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // Bullet vs Enemy Collision
    bullets.forEach((b, bi) => {
      const dist = Math.hypot(b.x - e.x, b.y - e.y);
      if (dist < e.radius + 6) {
        bullets.splice(bi, 1);
        e.hp--;
        spawnExplosion(b.x, b.y, '#38bdf8', 6);
        if (e.hp <= 0) {
          spawnExplosion(e.x, e.y, e.type === 'meteor' ? '#f97316' : '#ef4444', 24);
          score += e.type === 'meteor' ? 50 : 120;
          document.getElementById('score-el').innerText = score;
          
          if (score > highscore) {
            highscore = score;
            localStorage.setItem('omni_game_hs', highscore);
            document.getElementById('high-el').innerText = highscore;
          }

          // Wave Progression
          if (score >= wave * 800) {
            wave++;
            document.getElementById('wave-el').innerText = wave;
            Sound.powerup();
          }

          // Powerup drop chance
          if (Math.random() < 0.15) {
            powerups.push({ x: e.x, y: e.y, vy: 1.5, type: player.powerLevel < 3 ? 'weapon' : 'shield' });
          }
          enemies.splice(ei, 1);
        }
      }
    });

    // Player vs Enemy Collision
    const pDist = Math.hypot(player.x - e.x, player.y - e.y);
    if (pDist < player.radius + e.radius) {
      spawnExplosion(e.x, e.y, '#ef4444', 20);
      enemies.splice(ei, 1);
      player.shield -= 35;
      updateShieldUI();
      if (player.shield <= 0) gameOver();
    }

    if (e.y > 650) enemies.splice(ei, 1);
  });

  // Update & Draw Powerups
  powerups.forEach((pw, pwi) => {
    pw.y += pw.vy;
    ctx.fillStyle = pw.type === 'weapon' ? '#c084fc' : '#10b981';
    ctx.shadowBlur = 12;
    ctx.shadowColor = ctx.fillStyle;
    ctx.beginPath();
    ctx.arc(pw.x, pw.y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    if (Math.hypot(player.x - pw.x, player.y - pw.y) < player.radius + 12) {
      Sound.powerup();
      if (pw.type === 'weapon') {
        player.powerLevel = Math.min(3, player.powerLevel + 1);
      } else {
        player.shield = Math.min(100, player.shield + 40);
        updateShieldUI();
      }
      powerups.splice(pwi, 1);
    }
    if (pw.y > 650) powerups.splice(pwi, 1);
  });

  // Particles Loop
  particles.forEach((p, pi) => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    if (p.life <= 0) particles.splice(pi, 1);
  });
  ctx.globalAlpha = 1.0;

  requestAnimationFrame(gameLoop);
}

function updateShieldUI() {
  const pct = Math.max(0, player.shield);
  document.getElementById('shield-txt').innerText = pct + '%';
  document.getElementById('shield-bar').style.width = pct + '%';
}

function startGame() {
  gameState = 'PLAYING';
  score = 0; wave = 1;
  player.shield = 100;
  player.powerLevel = 1;
  player.x = 400; player.y = 500;
  bullets = []; enemies = []; particles = []; powerups = [];
  document.getElementById('score-el').innerText = '0';
  document.getElementById('wave-el').innerText = '1';
  updateShieldUI();
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameState = 'GAMEOVER';
  Sound.explode();
  document.getElementById('gameover-stats').innerText = `Final Score: ${score} | Sector Wave: ${wave}`;
  document.getElementById('gameover-screen').classList.remove('hidden');
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
</script>
</body>
</html>
