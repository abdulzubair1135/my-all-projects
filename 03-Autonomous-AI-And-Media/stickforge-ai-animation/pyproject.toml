[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stickforge-ai"
version = "1.0.0"
description = "AI-Powered Stickman Animation, Video Creation, Editing, and Social Media Publishing Studio"
authors = [{ name = "StickForge AI Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "edge-tts>=6.1.9",
    "pyttsx3>=2.90",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "srt>=3.5.0",
    "requests>=2.31.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "requests-oauthlib>=1.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
